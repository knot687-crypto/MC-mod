plugins {
    id 'fabric-loom' version "${loom_version}"
}

base {
    archivesName = "${archives_base_name}-client"
}

dependencies {
    // Compile time only: Loom provides the Yarn-named 1.21.11 classes. Nothing from
    // Fabric Loader or Fabric API is linked or shipped - the agent supplies the runtime.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
}

/**
 * The plain jar keeps the Yarn (named) namespace, which is what the agent's remapper
 * consumes at injection time. Loom writes it to devlibs and its remapJar output is not
 * used by anything.
 */

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "LICENSE_${project.base.archivesName.get()}" }
    }
}
