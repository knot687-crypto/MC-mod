plugins {
    id 'fabric-loom' version "${loom_version}"
}

base {
    archivesName = "${archives_base_name}-client"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // The @Bridge contract lives in the agent jar; compile against it, never bundle it.
    compileOnly project(':injector')
}

loom {
    // Loom 1.14 remaps mixin targets natively; no annotation processor or refmap file.
    mixin {
        defaultRefmapName = "vanta.refmap.json"
    }
    runs {
        client {
            client()
            ideConfigGenerated = true
            vmArg '-Dvanta.dev=true'
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
